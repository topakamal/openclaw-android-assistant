<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AnyClaw — Custom Endpoint Chat</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: #0f172a; color: #e2e8f0;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 8px;
    padding: 12px 16px; background: #1e293b;
    border-bottom: 1px solid #334155; flex: 0 0 auto;
  }
  header .dot { width: 10px; height: 10px; border-radius: 50%; background: #4ade80; }
  header .name { font-weight: 600; font-size: 15px; }
  header .sub { font-size: 12px; color: #94a3b8; }
  #modelRow { display: flex; gap: 8px; padding: 8px 14px; background: #1e293b; border-bottom: 1px solid #334155; flex: 0 0 auto; align-items: center; }
  #modelRow label { font-size: 13px; color: #94a3b8; }
  #model { flex: 1; background: #0f172a; color: #e2e8f0; border: 1px solid #334155; border-radius: 8px; padding: 8px 10px; font-size: 14px; }
  #messages { flex: 1 1 auto; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
  .msg { max-width: 85%; padding: 9px 12px; border-radius: 14px; font-size: 14.5px; line-height: 1.45; word-wrap: break-word; white-space: pre-wrap; }
  .msg.user { align-self: flex-end; background: #1d4ed8; border-bottom-right-radius: 4px; }
  .msg.bot { align-self: flex-start; background: #1e293b; border-bottom-left-radius: 4px; }
  .msg pre { background: #00000055; padding: 8px; border-radius: 8px; overflow-x: auto; font-size: 12.5px; margin: 6px 0; }
  .msg code { background: #00000055; padding: 1px 4px; border-radius: 4px; font-size: 12.5px; }
  .msg a { color: #60a5fa; }
  .typing { align-self: flex-start; color: #94a3b8; font-size: 13px; padding: 4px 8px; }
  footer { display: flex; gap: 8px; padding: 10px 12px; background: #1e293b; border-top: 1px solid #334155; flex: 0 0 auto; }
  #input { flex: 1; background: #0f172a; border: 1px solid #334155; border-radius: 20px; padding: 10px 14px; color: #e2e8f0; font-size: 14.5px; outline: none; }
  #send { background: #3b82f6; color: #fff; border: none; border-radius: 50%; width: 42px; height: 42px; font-size: 18px; cursor: pointer; flex: 0 0 auto; }
  #send:disabled { opacity: .4; }
  #statusBadge { font-size: 12px; color: #f87171; padding: 0 14px 6px; }
</style>
</head>
<body>
<header>
  <div class="dot"></div>
  <div>
    <div class="name">AnyClaw</div>
    <div class="sub">Custom endpoint chat</div>
  </div>
</header>

<div id="modelRow">
  <label for="model">Model</label>
  <input id="model" value="mercury-3" autocomplete="off">
</div>
<div id="statusBadge" style="display:none"></div>
<div id="messages"></div>

<footer>
  <input id="input" type="text" placeholder="Tulis pesan..." autocomplete="off">
  <button id="send" title="Kirim">➤</button>
</footer>

<script>
const $ = id => document.getElementById(id);
const messagesEl = $('messages'), inputEl = $('input'), sendBtn = $('send'), modelEl = $('model');
let history = [];
let streaming = false;

function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function md(s) {
  s = escapeHtml(s);
  s = s.replace(/```([\s\S]*?)```/g, '<pre>$1</pre>');
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  s = s.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
  s = s.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank">$1</a>');
  return s;
}
function addMsg(role, text) {
  const d = document.createElement('div');
  d.className = 'msg ' + role;
  const tag = document.createElement('div');
  tag.style.cssText = 'font-size:11px;color:#94a3b8;margin-bottom:3px;';
  tag.textContent = role === 'user' ? 'Kamu' : 'AI';
  d.appendChild(tag);
  const body = document.createElement('div');
  body.innerHTML = md(text);
  d.appendChild(body);
  messagesEl.appendChild(d);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return body;
}
function addTyping() {
  const d = document.createElement('div');
  d.className = 'typing'; d.id = 'typing';
  d.textContent = 'AI sedang mengetik…';
  messagesEl.appendChild(d);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}
function removeTyping() { const t = $('typing'); if (t) t.remove(); }
function setBadge(text, color) {
  const b = $('statusBadge');
  b.textContent = text;
  b.style.color = color || '#f87171';
  b.style.display = text ? 'block' : 'none';
}

async function send() {
  const text = inputEl.value.trim();
  if (!text || streaming) return;
  inputEl.value = '';
  history.push({ role: 'user', content: text });
  addMsg('user', text);
  streaming = true; sendBtn.disabled = true;
  addTyping(); setBadge('');
  const model = modelEl.value.trim() || 'mercury-3';
  let acc = '';
  try {
    const res = await fetch('/v1/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ model, messages: history, stream: true })
    });
    removeTyping();
    if (!res.ok) {
      let err = 'Error ' + res.status;
      try { const j = await res.json(); if (j.error && j.error.message) err = j.error.message; } catch (e) {}
      addMsg('bot', '⚠️ ' + err);
      history.push({ role: 'assistant', content: '⚠️ ' + err });
      setBadge(err);
      streaming = false; sendBtn.disabled = false;
      return;
    }
    const body = addMsg('bot', '');
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let idx;
      while ((idx = buf.indexOf('\n')) >= 0) {
        const line = buf.slice(0, idx).trim(); buf = buf.slice(idx + 1);
        if (!line.startsWith('data:')) continue;
        const data = line.slice(5).trim();
        if (data === '[DONE]') continue;
        try {
          const j = JSON.parse(data);
          const delta = j.choices && j.choices[0] && j.choices[0].delta;
          if (delta && delta.content) { acc += delta.content; body.innerHTML = md(acc); messagesEl.scrollTop = messagesEl.scrollHeight; }
        } catch (e) {}
      }
    }
    if (!acc) acc = '(kosong)';
    history.push({ role: 'assistant', content: acc });
    streaming = false; sendBtn.disabled = false;
  } catch (e) {
    removeTyping();
    addMsg('bot', '⚠️ Gagal terhubung: ' + e.message);
    setBadge(e.message);
    streaming = false; sendBtn.disabled = false;
  }
}

sendBtn.onclick = send;
inputEl.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
inputEl.focus();
</script>
</body>
</html>
